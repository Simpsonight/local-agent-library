[project]
name = "local-agent-library"
version = "0.1.0"
description = "CLI framework for manually orchestrating specialized AI agents"
requires-python = ">=3.11"
dependencies = [
    "litellm>=1.40,<2.0",
    "jinja2>=3.1,<4.0",
    "requests>=2.31,<3.0",
    "beautifulsoup4>=4.12,<5.0",
    "pyyaml>=6.0,<7.0",
    "python-dotenv>=1.0,<2.0",
    "rich>=13.7,<14.0",
    "questionary>=2.1,<3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "pytest-cov>=5.0,<6.0",
]

[project.scripts]
lal = "main:main"

[tool.setuptools]
py-modules = ["main"]

[tool.setuptools.packages.find]
include = ["core*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
