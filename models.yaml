# Model Registry — central source of truth for available LLM models.
# Used by cost tracking and preflight checks.
#
# Fields:
#   id              – model identifier passed to litellm
#   display_name    – human-readable label
#   provider        – provider name (for display)
#   api_key_env     – environment variable that must hold the API key
#   input_cost_per_1m  – approximate cost per 1M input tokens (USD)
#   output_cost_per_1m – approximate cost per 1M output tokens (USD)

models:
